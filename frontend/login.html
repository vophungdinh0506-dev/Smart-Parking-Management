<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — Smart Parking</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-auth="none" class="login-page">
  <main class="login-card">
    <div class="login-card__brand">Smart Parking</div>
    <h1 class="login-card__title">Đăng nhập</h1>
    <p class="muted login-card__subtitle">Hệ thống quản lý xe ra vào và tính phí gửi xe</p>

    <div id="login-error" class="alert alert--error" role="alert" hidden></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="50" required autofocus>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="btn-login">Đăng nhập</button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
